<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahu Catch & Play</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Start Screen -->
    <div id="start-screen" class="screen active">
        <!-- 👇 主界面的啃边猫猫 👇 -->
        <img class="peek-cat" src="assets/peek-cat.png" alt="Peeking Cat">
        
        <h1>Mahu Catch & Play</h1>
        <p class="subtitle">Use LEFT / RIGHT arrow keys to catch food and avoid toxic items!</p>
        
        <div class="button-group grid-2x2">
            <button id="start-btn">Start Game</button>
            <button id="gallery-btn" class="secondary-btn">Gallery</button>
            <button id="start-next-bg-btn" class="secondary-btn">Next Theme</button>
            <button id="start-bg-btn" class="secondary-btn">Custom BG</button>
            <input type="file" id="start-bg-upload" accept="image/*" style="display: none;">
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <!-- 👇 游戏界面的啃边猫猫 👇 -->
        <img class="peek-cat" src="assets/peek-cat.png" alt="Peeking Cat">

        <div id="score-board">
            <span>Score: <span id="score">0</span></span>
            <span style="margin-left: 30px;">HP: <span id="hp">3</span> ❤️</span>
            <button id="quit-btn" style="margin-left: 30px; padding: 5px 15px; font-size: 16px; vertical-align: middle; box-shadow: 0 2px 0 #cc7a00;">Quit</button>
        </div>
        
        <div id="game-area">
            <div id="float-container"></div>
            <div id="combo-display">Combo x1</div>
            
            <div id="floor"></div>
            <div id="cat-shadow"></div>

            <img id="cat" src="assets/cats/cat1.png" alt="Mahu">
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="screen">
        <!-- 👇 结束界面的啃边猫猫 👇 -->
        <img class="peek-cat" src="assets/peek-cat.png" alt="Peeking Cat">

        <h1>Game Over</h1>
        <p class="final-score-text">Final Score: <span id="final-score">0</span></p>
        
        <div style="display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; background: rgba(255,255,255,0.8); padding: 15px 30px; border-radius: 20px;">
            <img id="unlocked-cat-img" src="assets/cats/cat1.png" style="width: 80px; height: 80px; object-fit: contain;">
            <div style="text-align: left;">
                <p id="unlock-message" style="font-size: 18px; font-weight: bold; color: #6b4b3a; margin: 0;">当前形象: Mahu 1</p>
                <p id="next-unlock-info" style="font-size: 14px; color: #a07a65; margin: 5px 0 0 0;">距离解锁新形象还需 100 分</p>
            </div>
        </div>

        <p id="game-over-reason">You ate too much toxic food!</p>
        
        <div class="button-group grid-2x2">
            <button id="restart-btn">Play Again</button>
            <button id="over-gallery-btn" class="secondary-btn">Gallery</button>
            <button id="over-next-bg-btn" class="secondary-btn">Next Theme</button>
            <button id="bg-btn" class="secondary-btn">Custom BG</button>
            <input type="file" id="bg-upload" accept="image/*" style="display: none;">
        </div>
    </div>

    <!-- Gallery Modal -->
    <div id="gallery-modal" class="modal">
        <div class="modal-content">
            <h2>Mahu Gallery</h2>
            <p>Earn 100 points to unlock the next Mahu!</p>
            <div id="gallery-grid" class="gallery-grid">
                <!-- JS 会在这里生成 9 个形象格子 -->
            </div>
            <button id="close-gallery-btn" class="secondary-btn" style="margin-top: 20px;">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
